    function defaultMealTime() {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        d.setHours(19, 0, 0, 0);
        const p = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function readMealForm() {
        const v = id => (document.getElementById(id) || {}).value || "";
        const c = document.getElementById("mAge");
        return { store: v("mStore"), other: v("mOther").trim(), time: v("mTime"), size: v("mSize"),
                 nick: v("mNick").trim(), note: v("mNote").trim(), age: !!(c && c.checked) };
    }

    function renderMealForm(keep) {
        const box = document.getElementById("modalBox");
        box.className = "modal meal";
        const query = document.getElementById("cityInput").value;
        let options = stores.filter(s => matchCity(s, query));
        if (options.length === 0) options = stores;
        const selected = keep ? keep.store : (mealPrefillStoreId || (options[0] && options[0].id) || "other");
        if (mealPrefillStoreId && !options.some(s => String(s.id) === String(mealPrefillStoreId))) {
            const s = findStore(mealPrefillStoreId); if (s) options = [s].concat(options);
        }
        const mrank = s => (hasOffer(s) ? 4 : 0) + (isJing(s) ? 2 : isVegan(s) ? 1 : 0);
        options = options.map((s, i) => [s, i]).sort((a, b) => mrank(b[0]) - mrank(a[0]) || a[1] - b[1]).map(x => x[0]);
        const opts = options.map(s => `<option value="${esc(s.id)}" ${String(selected) === String(s.id) ? "selected" : ""}>${hasOffer(s) ? "🎁 " : ""}${esc(pick(s.name))}${discountText(s) ? " · " + esc(discountText(s)) : ""}</option>`).join("") +
                     `<option value="other" ${selected === "other" ? "selected" : ""}>${esc(T("mealOther"))}</option>`;
        const size = keep ? keep.size : "4";
        const sizes = [2, 3, 4, 5, 6, 8].map(n => `<option value="${n}" ${String(n) === String(size) ? "selected" : ""}>${n}</option>`).join("");
        const nick = keep ? keep.nick : (lsGet("veganspy_nick") || "");
        box.innerHTML = `
            <h3>${esc(T("mealFormTitle"))}</h3>
            <label class="f-label" for="mStore">${esc(T("mealStore"))} *</label>
            <select class="f-select" id="mStore" onchange="document.getElementById('mOtherWrap').hidden = this.value !== 'other'">${opts}</select>
            ${options.some(hasOffer) ? `<div class="chk-foot">${esc(T("offerMealTip"))}</div>` : ""}
            <div id="mOtherWrap" ${selected === "other" ? "" : "hidden"}>
                <input class="f-input" id="mOther" style="margin-top:6px" maxlength="60" placeholder="${esc(T("mealOtherPh"))}" value="${esc(keep ? keep.other : "")}">
            </div>
            <div class="f-row">
                <div>
                    <label class="f-label" for="mTime">${esc(T("mealTime"))} *</label>
                    <input class="f-input" id="mTime" type="datetime-local" value="${esc(keep ? keep.time : defaultMealTime())}">
                </div>
                <div>
                    <label class="f-label" for="mSize">${esc(T("mealSize"))}</label>
                    <select class="f-select" id="mSize">${sizes}</select>
                </div>
            </div>
            <label class="f-label" for="mNick">${esc(T("mealNick"))} *</label>
            <input class="f-input" id="mNick" maxlength="20" placeholder="${esc(T("mealNickPh"))}" value="${esc(nick)}">
            <label class="f-label" for="mNote">${esc(T("mealNote"))}</label>
            <textarea class="f-textarea" id="mNote" maxlength="200" placeholder="${esc(T("mealNotePh"))}">${esc(keep ? keep.note : "")}</textarea>
            <label class="f-check"><input type="checkbox" id="mAge" ${keep && keep.age ? "checked" : ""}> <span>${esc(T("mealAge"))}</span></label>
            <div class="f-hint">${esc(T("mealSafety"))} <button class="link-inline" onclick="openRules()">${esc(T("footerRules"))}</button></div>
            <div class="f-actions">
                <button class="f-cancel" onclick="closeModal()">${esc(T("cancel"))}</button>
                <button class="f-submit" id="mSubmit" onclick="submitMeal()">${esc(T("submit"))}</button>
            </div>`;
    }

    async function submitMeal() {
        const f = readMealForm();
        const store = f.store === "other" ? null : findStore(f.store);
        const storeName = store ? pick(store.name) : f.other;
        if (!storeName || !f.time || !f.nick) { showToast(T("mealNeed")); return; }
        if (new Date(f.time).getTime() < Date.now()) { showToast(T("mealTimeNeed")); return; }
        if (!f.age) { showToast(T("mealAgeNeed")); return; }
        if (hasContact(f.note) || hasContact(f.nick) || hasContact(f.other)) { showToast(T("contactWarn")); return; }
        if (hasBadWords(f.note, f.nick, f.other)) { showToast(T("badWords")); return; }
        const cityText = store ? store.city : document.getElementById("cityInput").value.trim();
        const doc = {
            storeId: store ? store.id : "", storeName,
            city: cityText, cityAliases: store ? (store.cityAliases || []) : [],
            time: f.time, size: Number(f.size) || 4,
            host: f.nick.slice(0, 20), note: f.note.slice(0, 200),
            uid: myUid, createdAt: new Date().toISOString()
        };
        lsSet("veganspy_nick", doc.host);
        const btn = document.getElementById("mSubmit"); if (btn) btn.disabled = true;
        const ok = await mealWrite("meals", "set", newId(), doc);
        if (btn) btn.disabled = false;
        if (!ok) return;
        closeModal();
        showToast(T("mealPostOk"));
        refreshMealsUI();
    }

    // ---- 报名 ----
    function openJoin(mealId) {
        if (mealMode === "readonly") { showToast(T("mealNoPerm")); return; }
        joinMealId = mealId;
        currentFormType = "join";
        renderJoinForm();
        document.getElementById("modalMask").classList.add("active");
        document.body.classList.add("no-scroll");
    }

    function readJoinForm() {
        const v = id => (document.getElementById(id) || {}).value || "";
        const c = document.getElementById("jAge");
        return { nick: v("jNick").trim(), msg: v("jMsg").trim(), age: !!(c && c.checked) };
    }

    function renderJoinForm(keep) {
        const m = meals.find(x => x.id === joinMealId);
        const box = document.getElementById("modalBox");
        box.className = "modal meal";
        const nick = keep ? keep.nick : (lsGet("veganspy_nick") || "");
        box.innerHTML = `
            <h3>${esc(T("joinTitle"))}</h3>
            ${m ? `<div class="meal-note" style="margin:0 0 4px">📍 ${esc(m.storeName)} · 🕖 ${esc(mealTimeText(m.time))}</div>` : ""}
            <label class="f-label" for="jNick">${esc(T("mealNick"))} *</label>
            <input class="f-input" id="jNick" maxlength="20" placeholder="${esc(T("mealNickPh"))}" value="${esc(nick)}">
            <label class="f-label" for="jMsg">${esc(T("joinMsg"))}</label>
            <input class="f-input" id="jMsg" maxlength="60" placeholder="${esc(T("joinMsgPh"))}" value="${esc(keep ? keep.msg : "")}">
            <label class="f-check"><input type="checkbox" id="jAge" ${keep && keep.age ? "checked" : ""}> <span>${esc(T("mealAge"))}</span></label>
            <div class="f-hint">${esc(T("mealSafety"))} <button class="link-inline" onclick="openRules()">${esc(T("footerRules"))}</button></div>
            <div class="f-actions">
                <button class="f-cancel" onclick="closeModal()">${esc(T("cancel"))}</button>
                <button class="f-submit" id="jSubmit" onclick="submitJoin()">${esc(T("submit"))}</button>
            </div>`;
    }

    async function submitJoin() {
        const f = readJoinForm();
        const m = meals.find(x => x.id === joinMealId);
        if (!m) { closeModal(); return; }
        if (!f.nick) { showToast(T("mealNeed")); return; }
        if (!f.age) { showToast(T("mealAgeNeed")); return; }
        if (hasContact(f.nick) || hasContact(f.msg)) { showToast(T("contactWarn")); return; }
        if (hasBadWords(f.nick, f.msg)) { showToast(T("badWords")); return; }
        if (1 + joinsOf(m.id).length >= (Number(m.size) || 2)) { showToast(T("mealFull")); closeModal(); return; }
        lsSet("veganspy_nick", f.nick.slice(0, 20));
        const btn = document.getElementById("jSubmit"); if (btn) btn.disabled = true;
        const ok = await mealWrite("joins", "set", newId(), {
            mealId: m.id, nick: f.nick.slice(0, 20), msg: f.msg.slice(0, 60), uid: myUid, createdAt: new Date().toISOString()
        });
        if (btn) btn.disabled = false;
        if (!ok) return;
        closeModal();
        showToast(T("joinOk"));
    }

    async function leaveMeal(mealId) {
        const mine = joinsOf(mealId).filter(j => j.uid === myUid);
        for (const j of mine) { if (!(await mealWrite("joins", "delete", j.id))) return; }
        showToast(T("leaveOk"));
    }

    // 取消需要点两次（页面里不能弹确认框）
    async function cancelMeal(mealId) {
        if (pendingCancelId !== mealId) {
            pendingCancelId = mealId;
            refreshMealsUI();
            setTimeout(() => { if (pendingCancelId === mealId) { pendingCancelId = null; refreshMealsUI(); } }, 4000);
            return;
        }
        pendingCancelId = null;
        if (!(await mealWrite("meals", "delete", mealId))) return;
        for (const j of joinsOf(mealId)) { await mealWrite("joins", "delete", j.id); }
        showToast(T("cancelOk"));
        refreshMealsUI();
    }


    // ================= 🛡️ 收藏 / 举报 / 屏蔽 / 内容过滤 =================
    // 联系邮箱：填上后，页面底部和「社区规则」里会显示（App Store 要求公布联系方式）
    const CONTACT_EMAIL = "";
    let reports = [];      // { id, targetType, targetId, targetUid, reason, detail, uid, createdAt }
    let isAdmin = false;   // 页面主人可以删除任何约饭帖
    let currentView = "radar";
    const REPORT_HIDE_AT = 3;   // 被 3 个不同的人举报后自动隐藏

    function lsList(key) { try { return JSON.parse(lsGet(key) || "[]"); } catch (e) { return []; } }
    let favs = new Set(lsList("veganspy_favs"));
    let blocked = new Set(lsList("veganspy_blocked"));

    function isFav(id) { return favs.has(String(id)); }
    function toggleFav(id, ev) {
        if (ev) ev.stopPropagation();
        id = String(id);
        if (favs.has(id)) { favs.delete(id); showToast(T("favRemoved")); } else { favs.add(id); showToast(T("favAdded")); }
        lsSet("veganspy_favs", JSON.stringify([...favs]));
        renderList();
        if (currentStoreId) renderFavBtn();
    }
    function favBtnHtml(id) {
        const on = isFav(id);
        return `<button class="fav-btn ${on ? "on" : ""}" aria-pressed="${on}" onclick="toggleFav('${esc(id)}', event)">${esc(on ? T("favOn") : T("favAdd"))}</button>`;
    }
    function renderFavBtn() {
        const box = document.getElementById("detailFav");
        if (box && currentStoreId) box.innerHTML = favBtnHtml(currentStoreId);
    }

    // 简单的不良词语过滤（可以按需要往里加词）
    const BAD_WORDS = ["傻逼", "煞笔", "操你", "草你妈", "他妈的", "去死", "贱人", "婊子", "约炮", "一夜情", "援交", "裸聊", "嫖",
        "色情", "毒品", "冰毒", "大麻", "赌博", "博彩", "刷单", "代开发票", "日结兼职", "加群领", "fuck", "shit", "bitch", "porn", "nigger", "cunt"];
    function hasBadWords(...texts) {
        const s = texts.join(" ").toLowerCase().replace(/\s+/g, "");
        return BAD_WORDS.some(w => s.includes(w));
    }

    function reportCount(mealId) {
        return new Set(reports.filter(r => r.targetType === "meal" && r.targetId === mealId).map(r => r.uid)).size;
    }
    function mealVisible(m) {
        if (blocked.has(m.uid)) return false;
        if (!isAdmin && m.uid !== myUid && reportCount(m.id) >= REPORT_HIDE_AT) return false;
        return true;
    }

    // ---- 举报 / 屏蔽表单 ----
    let reportMealId = null;
    function openReport(mealId) {
        reportMealId = mealId;
        currentFormType = "report";
        renderReportForm();
        document.getElementById("modalMask").classList.add("active");
        document.body.classList.add("no-scroll");
    }
    function readReportForm() {
        const v = id => (document.getElementById(id) || {}).value || "";
        const c = document.getElementById("rBlock");
        return { who: v("rWho"), reason: v("rReason"), detail: v("rDetail").trim(), block: !!(c && c.checked) };
    }
    function renderReportForm(keep) {
        const m = meals.find(x => x.id === reportMealId);
        const box = document.getElementById("modalBox");
        box.className = "modal meal";
        if (!m) { closeModal(); return; }
        const people = [{ uid: m.uid, name: "👑 " + (m.host || T("anonymous")) }]
            .concat(joinsOf(m.id).map(j => ({ uid: j.uid, name: j.nick || T("anonymous") })))
            .filter(p => p.uid !== myUid);
        const who = keep ? keep.who : (people[0] && people[0].uid);
        const reasons = ["rFake", "rHarass", "rAd", "rDanger", "rOther"];
        const reason = keep ? keep.reason : "rHarass";
        box.innerHTML = `
            <h3>${esc(T("reportTitle"))}</h3>
            <div class="meal-note" style="margin:0 0 4px">📍 ${esc(m.storeName)} · 🕖 ${esc(mealTimeText(m.time))}</div>
            <label class="f-label" for="rWho">${esc(T("reportWho"))}</label>
            <select class="f-select" id="rWho">${people.map(p => `<option value="${esc(p.uid)}" ${p.uid === who ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
            <label class="f-label" for="rReason">${esc(T("reportReason"))}</label>
            <select class="f-select" id="rReason">${reasons.map(r => `<option value="${r}" ${r === reason ? "selected" : ""}>${esc(T(r))}</option>`).join("")}</select>
            <label class="f-label" for="rDetail">${esc(T("reportDetail"))}</label>
            <textarea class="f-textarea" id="rDetail" maxlength="300">${esc(keep ? keep.detail : "")}</textarea>
            <label class="f-check"><input type="checkbox" id="rBlock" ${!keep || keep.block ? "checked" : ""}> <span>${esc(T("reportBlock"))}</span></label>
            <div class="f-actions">
                <button class="f-cancel" onclick="closeModal()">${esc(T("cancel"))}</button>
                <button class="f-submit" id="rSubmit" onclick="submitReport()">${esc(T("reportSend"))}</button>
            </div>`;
    }
    async function submitReport() {
        const f = readReportForm();
        const m = meals.find(x => x.id === reportMealId);
        if (!m || !f.who) { closeModal(); return; }
        const btn = document.getElementById("rSubmit"); if (btn) btn.disabled = true;
        let ok = true;
        if (mealMode !== "readonly") {
            ok = await mealWrite("reports", "set", newId(), {
                targetType: "meal", targetId: m.id, targetUid: f.who, reason: f.reason,
                detail: f.detail.slice(0, 300), uid: myUid, createdAt: new Date().toISOString()
            });
        }
        if (btn) btn.disabled = false;
        if (f.block) {
            blocked.add(f.who);
            lsSet("veganspy_blocked", JSON.stringify([...blocked]));
        }
        closeModal();
        refreshStoresUI();
        showToast(f.block ? T("blockOk") : (ok ? T("reportOk") : T("mealErr")));
        refreshMealsUI();
    }
    function unblockAll() {
        blocked = new Set();
        lsSet("veganspy_blocked", "[]");
        showToast(T("unblockOk"));
        refreshMealsUI();
    }

    // ---- 社区规则 ----
    let rulesReturn = null;   // 从表单里打开规则时，看完回到原来的表单
    function openRules() {
        if (currentFormType === "meal") rulesReturn = { type: "meal", data: readMealForm(), store: mealPrefillStoreId };
        else if (currentFormType === "join") rulesReturn = { type: "join", data: readJoinForm(), meal: joinMealId };
        else rulesReturn = null;
        currentFormType = "rules";
        renderRules();
        document.getElementById("modalMask").classList.add("active");
        document.body.classList.add("no-scroll");
    }
    function renderRules() {
        const box = document.getElementById("modalBox");
        box.className = "modal meal";
        box.innerHTML = `
            <h3>${esc(T("rulesTitle"))}</h3>
            <div class="rules-body">${esc(T("rulesBody"))}</div>
            ${CONTACT_EMAIL ? `<div class="f-hint">${esc(T("rulesContact"))}<span class="sel">${esc(CONTACT_EMAIL)}</span></div>` : ""}
            <div class="f-actions"><button class="f-submit" onclick="closeRules()">${esc(T("rulesOk"))}</button></div>`;
    }
    function closeRules() {
        const r = rulesReturn; rulesReturn = null;
        if (r && r.type === "meal") { currentFormType = "meal"; mealPrefillStoreId = r.store; renderMealForm(r.data); return; }
        if (r && r.type === "join") { currentFormType = "join"; joinMealId = r.meal; renderJoinForm(r.data); return; }
        closeModal();
    }
    function renderFooter() {
        const el = document.getElementById("appFooter");
        if (!el) return;
        el.innerHTML = `<button class="foot-link" onclick="openRules()">${esc(T("footerRules"))}</button>` +
            (CONTACT_EMAIL ? `<span>${esc(T("footerContact"))}：<span class="sel">${esc(CONTACT_EMAIL)}</span></span>` : "") +
            (blocked.size ? `<button class="foot-link" onclick="unblockAll()">${esc(T("footerUnblock"))}</button>` : "");
    }


    // ================= 🔍 素食核对清单（商家填写 + 食客验证） =================
    // 每一项的值：true = 符合素食要求（没有五辛 / 没有蛋 / 锅具分开 / 纯植物油 / 没有酒）
    //             false = 不符合，null = 还不知道
    const ATTRS = [
        { k: "wuxin",   ok: "wuxinOk", bad: "wuxinBad", unk: "wuxinUnk",   name: "wuxinName" },
        { k: "egg",     ok: "eggOk",   bad: "eggBad",   unk: "eggUnk",     name: "eggName" },
        { k: "dairy",   ok: "dairyOk", bad: "dairyBad", unk: "dairyUnk",   name: "dairyName" },
        { k: "pot",     ok: "potOk",   bad: "potFail",  unk: "potUnknown", name: "potName" },
        { k: "oil",     ok: "oilOk",   bad: "oilFail",  unk: "oilUnknown", name: "oilName" },
        { k: "alcohol", ok: "alcOk",   bad: "alcBad",   unk: "alcUnk",     name: "alcName" }
    ];
    const CONFIRM_AT = 2;   // 2 位食客反馈一致，就算「食客确认」或「有人质疑」
    let votes = [];         // { id, storeId, attr, vote: "ok"|"bad", uid, createdAt }
    let dbStores = [];      // 用户新发布的店
    let comments = [];      // { id, storeId, text, author, uid, createdAt }
    let currentDiet = "all";
    let onlyOffer = false;   // 只看有素探优惠的店
    function hasOffer(s) { return (Number(s.discount) || 0) > 0 || !!(s.offer && String(s.offer).trim()); }
    // 折扣：discount 存的是「减百分之几」，比如 10 = 中文的「9 折」
    const DISCOUNTS = [5, 10, 15, 20, 25, 30, 40, 50];
    function discountLabel(p) { return fmt(T("discountFmt"), { p, z: String((100 - p) / 10).replace(/\.0$/, "") }); }
    function discountText(s) { const p = Number(s.discount) || 0; return p > 0 ? discountLabel(p) : ""; }
    function offerSummary(s) { return discountText(s) || (s.offer || ""); }

    function fmt(str, vars) { return String(str).replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : ""); }

    function normalizeStore(d) {
        const attrs = {};
        ATTRS.forEach(a => { const v = d.attrs ? d.attrs[a.k] : null; attrs[a.k] = v === true || v === false ? v : null; });
        return { id: d.id, city: d.city || "", cityAliases: d.cityAliases || [], name: d.name || "", address: d.address || "",
                 source: d.source === "owner" ? "owner" : "user", attrs, allVegan: d.allVegan === true,
                 update: d.update || "", offer: d.offer || "", discount: [5, 10, 15, 20, 25, 30, 40, 50].includes(Number(d.discount)) ? Number(d.discount) : 0, offerLimit: [0, 1, 7, 30].includes(Number(d.offerLimit)) ? Number(d.offerLimit) : 7, updated: d.updated || d.createdAt || "", uid: d.uid || "", comments: [] };
    }
    function rebuildStores() {
        stores = dbStores.filter(d => !blocked.has(d.uid)).map(normalizeStore).concat(seedStores);
    }

    function votesFor(id, k) {
        const vs = votes.filter(v => v.storeId === String(id) && v.attr === k && !blocked.has(v.uid));
        const mine = vs.find(v => v.uid === myUid);
        return { A: vs.filter(v => v.vote === "ok").length, P: vs.filter(v => v.vote === "bad").length, mine: mine ? mine.vote : null, mineId: mine ? mine.id : null };
    }
    function attrInfo(s, k) {
        const d = s.attrs ? s.attrs[k] : null;
        const v = votesFor(s.id, k);
        let val = d, src = d == null ? null : s.source;
        if (d == null) {
            if (v.A >= CONFIRM_AT && v.A > v.P) { val = true; src = "crowd"; }
            else if (v.P >= CONFIRM_AT && v.P > v.A) { val = false; src = "crowd"; }
        }
        let state = "normal", agree = 0, disagree = 0;
        if (d != null) {
            agree = d ? v.A : v.P; disagree = d ? v.P : v.A;
            if (disagree >= CONFIRM_AT && disagree >= agree) state = "disputed";
            else if (agree >= CONFIRM_AT) state = "confirmed";
        }
        return { val, src, state, agree, disagree, mine: v.mine, mineId: v.mineId };
    }
    function okVal(s, k) { const i = attrInfo(s, k); return i.val === true && i.state !== "disputed"; }
    function isVegan(s) { return okVal(s, "egg") && okVal(s, "dairy"); }
    function isJing(s) { return isVegan(s) && okVal(s, "wuxin"); }
    function dietMatch(s) { return (currentDiet === "all" || (currentDiet === "jing" ? isJing(s) : isVegan(s))) && (!onlyOffer || hasOffer(s)); }

    function tagClass(i) { return i.val === true ? (i.state === "disputed" ? "t-warn" : "t-ok") : i.val === false ? "t-bad" : "t-unk"; }
    function tagText(i, a) { return i.val === true ? T(a.ok) : i.val === false ? T(a.bad) : T(a.unk); }
    function tagHtml(s, a) {
        const i = attrInfo(s, a.k);
        return `<span class="tag ${tagClass(i)}">${esc(tagText(i, a))}${i.state === "confirmed" ? " ✓" : ""}${i.state === "disputed" ? " ?" : ""}</span>`;
    }
    function levelBadge(s) {
        if (isJing(s)) return `<span class="lvl jing">${esc(T("levelJing"))}</span>`;
        if (isVegan(s)) return `<span class="lvl vegan">${esc(T("levelVegan"))}</span>`;
        return "";
    }
    function tagsHtml(s) { return levelBadge(s) + ATTRS.map(a => tagHtml(s, a)).join(""); }

    function renderDietChips() {
        const box = document.getElementById("dietChips");
        if (!box) return;
        const base = currentView === "favs" ? stores.filter(s => isFav(s.id)) : stores.filter(s => matchCity(s, document.getElementById("cityInput").value));
        const opts = [["all", "dietAll", base.length], ["vegan", "dietVegan", base.filter(isVegan).length], ["jing", "dietJing", base.filter(isJing).length]];
        box.innerHTML = opts.map(([v, key, n]) =>
            `<button class="diet-chip ${currentDiet === v ? "on" : ""}" aria-pressed="${currentDiet === v}" onclick="setDiet('${v}')">${esc(T(key))} ${n}</button>`).join("") +
            `<button class="diet-chip offer ${onlyOffer ? "on" : ""}" aria-pressed="${onlyOffer}" onclick="toggleOffer()">${esc(T("offerFilter"))} ${base.filter(hasOffer).length}</button>`;
        document.getElementById("dietHint").textContent = T("dietHint");
    }
    function setDiet(v) { currentDiet = v; renderList(); }
    function toggleOffer() { onlyOffer = !onlyOffer; renderList(); }

    function parseDay(iso) {
        if (iso && /^\d{4}-\d{2}$/.test(iso)) { const [y, m] = iso.split("-").map(Number); return new Date(y, m - 1, 1); }
        return new Date(iso);
    }
    function monthText(iso) {
        const d = parseDay(iso);
        if (isNaN(d)) return "";
        return d.toLocaleDateString(htmlLangMap[currentLang], { year: "numeric", month: "long" });
    }


    // ================= 🎟️ 优惠券（领取 + 统计） =================
    let claims = [];   // { id, storeId, code, uid, createdAt }
    let couponTimer = null;
    let couponStoreId = null;
    const DAY = 24 * 3600 * 1000;
    function couponDays(s) { return Math.max(Number(s.offerLimit) || 0, 1); }   // 有效期：至少 1 天
    function myValidClaim(s) {
        const mine = claims.filter(c => c.storeId === String(s.id) && c.uid === myUid)
                           .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0];
        if (!mine) return null;
        const until = new Date(mine.createdAt).getTime() + couponDays(s) * DAY;
        return Date.now() < until ? mine : null;
    }
    function claimsThisMonth(s) {
        const now = new Date(); const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        return new Set(claims.filter(c => c.storeId === String(s.id) && new Date(c.createdAt).getTime() >= start).map(c => c.uid)).size;
    }
    function renderClaimRow(s) {
        const row = document.getElementById("claimRow");
        if (!row) return;
        const mine = myValidClaim(s);
        const n = claimsThisMonth(s);
        row.innerHTML = `<button class="claim-btn ${mine ? "view" : ""}" ${!mine && mealMode === "readonly" ? "disabled" : ""} onclick="claimOffer('${esc(s.id)}')">${esc(T(mine ? "claimView" : "claimBtn"))}</button>
            ${n ? `<span class="claim-count">${esc(fmt(T("claimedMonthFmt"), { n }))}</span>` : ""}`;
    }
    function newCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let c = ""; for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
        return "VS-" + c;
    }
    async function claimOffer(storeId) {
        const s = findStore(storeId); if (!s || !hasOffer(s)) return;
        if (myValidClaim(s)) { openCoupon(storeId); return; }
        if (mealMode === "readonly") { showToast(T("mealNoPerm")); return; }
        const ok = await mealWrite("claims", "set", newId(), { storeId: String(storeId), code: newCode(), uid: myUid, createdAt: new Date().toISOString() });
        if (!ok) return;
        showToast(T("claimOk"));
        openCoupon(storeId);
    }
    function openCoupon(storeId) {
        couponStoreId = storeId;
        currentFormType = "coupon";
        renderCoupon();
        document.getElementById("modalMask").classList.add("active");
        document.body.classList.add("no-scroll");
        clearInterval(couponTimer);
        couponTimer = setInterval(() => {
            const el = document.getElementById("couponClock");
            if (!el) { clearInterval(couponTimer); return; }
            el.textContent = new Date().toLocaleString(htmlLangMap[currentLang], { hour: "2-digit", minute: "2-digit", second: "2-digit", month: "short", day: "numeric" });
        }, 1000);
    }
    function renderCoupon() {
        const s = findStore(couponStoreId);
        const box = document.getElementById("modalBox");
        box.className = "modal meal";
        const mine = s ? claims.filter(c => c.storeId === String(s.id) && c.uid === myUid)
                               .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0] : null;
        if (!s || !mine) { closeModal(); return; }
        const until = new Date(new Date(mine.createdAt).getTime() + couponDays(s) * DAY);
        const expired = Date.now() >= until.getTime();
        const dt = d => d.toLocaleString(htmlLangMap[currentLang], { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        box.innerHTML = `
            <h3>${esc(T("couponTitle"))}</h3>
            <div class="coupon ${expired ? "expired" : ""}">
                <div class="coupon-store">${esc(pick(s.name))}</div>
                ${discountText(s) ? `<div class="coupon-discount">${esc(discountText(s))}</div>` : ""}
                ${s.offer ? `<div class="coupon-offer">${esc(s.offer)}</div>` : `<div style="height:10px"></div>`}
                <div class="coupon-code">${esc(mine.code)}</div>
                <div class="coupon-meta">
                    <span>${esc(T("couponTime"))}</span><b>${esc(dt(new Date(mine.createdAt)))}</b>
                    <span>⏳</span><b>${esc(expired ? T("couponExpired") : fmt(T("couponValidFmt"), { d: dt(until) }))}</b>
                </div>
                <div class="coupon-live"><span class="live-dot"></span><span>${esc(T("couponLive"))}</span> <span id="couponClock">${esc(new Date().toLocaleString(htmlLangMap[currentLang], { hour: "2-digit", minute: "2-digit", second: "2-digit", month: "short", day: "numeric" }))}</span></div>
            </div>
            <div class="f-hint">${esc(T("couponShow"))} ${esc(T("couponUsedHint"))}</div>
            <div class="f-actions"><button class="f-submit" onclick="closeModal()">${esc(T("close"))}</button></div>`;
    }

    function renderOffer(s) {
        const sec = document.getElementById("offerSection");
        if (!sec) return;
        sec.hidden = !hasOffer(s);
        document.getElementById("secOffer").textContent = T("offerTitle");
        document.getElementById("offerText").innerHTML = (discountText(s) ? `<div class="offer-big">${esc(discountText(s))}</div>` : "") +
            (s.offer ? `<div>${esc(s.offer)}</div>` : "");
        document.getElementById("offerHow").textContent = T("offerHow");
        if (hasOffer(s)) renderClaimRow(s);
    }
    function renderCheck() {
        const s = findStore(currentStoreId);
        const box = document.getElementById("detail-check");
        if (!s || !box) return;
        renderOffer(s);
        document.getElementById("detailMetrics").innerHTML = tagsHtml(s) + (s.allVegan ? `<span class="tag t-ok">✅ ${esc(T("allVegan"))}</span>` : "");
        const dis = mealMode === "readonly" ? "disabled" : "";
        const rows = ATTRS.map(a => {
            const i = attrInfo(s, a.k);
            const srcTxt = i.src === "owner" ? T("srcOwner") : i.src === "user" ? T("srcUser") : i.src === "crowd" ? T("srcCrowd") : T("srcNone");
            const extra = i.state === "confirmed" ? fmt(T("confirmedFmt"), { n: i.agree }) : i.state === "disputed" ? fmt(T("disputedFmt"), { n: i.disagree }) : "";
            return `
                <div class="chk-row">
                    <div class="chk-main">
                        <div class="chk-name">${esc(T(a.name))}</div>
                        <span class="tag ${tagClass(i)}">${esc(tagText(i, a))}</span>
                    </div>
                    <div class="chk-src">${esc(srcTxt)}${extra ? " · " + esc(extra) : ""}</div>
                    <div class="chk-vote">
                        <button class="v-btn ${i.mine === "ok" ? "on" : ""}" ${dis} aria-pressed="${i.mine === "ok"}" onclick="castVote('${esc(s.id)}','${a.k}','ok')">${esc(T(a.ok))}</button>
                        <button class="v-btn bad ${i.mine === "bad" ? "on" : ""}" ${dis} aria-pressed="${i.mine === "bad"}" onclick="castVote('${esc(s.id)}','${a.k}','bad')">${esc(T(a.bad))}</button>
                    </div>
                </div>`;
        }).join("");
        const updated = s.updated || "";
        const age = Date.now() - parseDay(updated).getTime();
        const stale = age > 183 * 24 * 3600 * 1000;
        box.innerHTML = `<div class="chk-hint">${esc(T("voteAsk"))}</div>${rows}
            <div class="chk-foot">${updated ? esc(fmt(T("updatedFmt"), { d: monthText(updated) })) : ""}${stale ? " · ⚠️ " + esc(T("staleWarn")) : ""}${s.source === "owner" ? "<br>" + esc(T("ownerDisclaimer")) : ""}</div>`;
    }

    // 投票：点一次记录，再点同一个按钮就撤回
    async function castVote(storeId, k, v) {
        if (mealMode === "readonly") { showToast(T("mealNoPerm")); return; }
        const s = findStore(storeId); if (!s) return;
        const i = attrInfo(s, k);
        const id = (String(storeId) + "__" + k + "__" + String(myUid)).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");
        if (i.mine === v) {
            if (await mealWrite("votes", "delete", i.mineId || id)) showToast(T("voteRemoved"));
            return;
        }
        if (i.mineId && i.mineId !== id) await mealWrite("votes", "delete", i.mineId);
        if (await mealWrite("votes", "set", id, { storeId: String(storeId), attr: k, vote: v, uid: myUid, createdAt: new Date().toISOString() })) showToast(T("voteThanks"));
    }

    function refreshStoresUI() {
        rebuildStores();
        renderList();
        if (currentStoreId) {
            if (!findStore(currentStoreId)) { closeDetailPage(); return; }
            renderCheck();
            renderComments();
        }
    }

    // ================= 语言切换 =================
    function changeLanguage(lang) {
        if (!uiDictionary[lang]) lang = "zh";
        currentLang = lang;
        document.documentElement.lang = htmlLangMap[lang] || lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

        document.getElementById("app-title").textContent = T("title");
        document.getElementById("lbl-city").textContent = T("city");
        document.getElementById("btn-act-user").textContent = T("btnUser");
        document.getElementById("btn-act-owner").textContent = T("btnOwner");
        document.getElementById("backBtn").textContent = T("back");
        document.getElementById("detailAppTitle").textContent = T("detailTitle");
        document.getElementById("secUpdate").textContent = T("secUpdate");
        document.getElementById("secComments").textContent = T("secComments");
        document.getElementById("commentInput").placeholder = T("commentPh");
        document.getElementById("sendBtn").textContent = T("send");
        document.getElementById("tabRadar").textContent = T("tabRadar");
        document.getElementById("tabMeals").textContent = T("tabMeals");
        document.getElementById("tabFav").textContent = T("tabFav");
        document.getElementById("btn-act-meal").textContent = T("btnMeal");
        document.getElementById("secMeals").textContent = T("secMeals");
        document.getElementById("secCheck").textContent = T("checkTitle");

        // 如果城市框还是某个语言的默认值，就换成新语言的默认值；用户自己输入的不动
        const cityInput = document.getElementById("cityInput");
        cityInput.placeholder = T("cityPh");
        const defaults = Object.values(uiDictionary).map(d => d.defaultCitySearch);
        if (defaults.includes(cityInput.value.trim())) cityInput.value = T("defaultCitySearch");

        renderHome();
        renderList();
        if (currentStoreId) renderDetail();
        renderMeals();
        renderFooter();
        if (currentFormType === "meal") renderMealForm(readMealForm());
        else if (currentFormType === "join") renderJoinForm(readJoinForm());
        else if (currentFormType === "report") renderReportForm(readReportForm());
        else if (currentFormType === "rules") renderRules();
        else if (currentFormType === "coupon") renderCoupon();
        else if (currentFormType) renderForm(readForm());
    }

    // ================= 启动 =================
    document.addEventListener("keydown", e => {
        if (e.key !== "Escape") return;
        if (document.getElementById("videoMask").classList.contains("active")) closeVideo();
        else if (currentFormType) closeModal();
        else if (currentStoreId) closeDetailPage();
    });
    changeLanguage(document.getElementById("langSelect").value);
    initMeals();
</script>
</body>
</html>
