<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 🛡️ 强制全球通用 UTF-8 编码，字字清晰，绝不乱码 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>素探 VeganSpy - 全球高清真实素食雷达</title>
    <style>
        /* 💡 苹果上架级原生 CSS - 0语法错误，优雅融入高清图片，拒绝空洞 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; min-height: 100vh; background: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* 顶部大牌状态栏：半透明遮罩叠加，透出底层新鲜食材大图，极具美感 */
        header { 
            background: linear-gradient(rgba(4, 120, 87, 0.85), rgba(6, 95, 70, 0.9)), url('https://unsplash.com'); 
            background-size: cover;
            background-position: center;
            color: #ffffff; 
            padding: 18px 16px; 
            position: sticky; 
            top: 0; 
            z-index: 40; 
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .header-top h1 { font-size: 22px; font-weight: 900; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .lang-select { background: #065f46; color: #ffffff; border: 1px solid #047857; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .city-bar { background: rgba(6, 95, 70, 0.7); padding: 8px 12px; border-radius: 8px; display: flex; gap: 8px; align-items: center; backdrop-filter: blur(4px); }
        .city-input { background: #ffffff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; flex: 1; outline: none; font-weight: 500; }
        .city-label { font-size: 12px; font-weight: bold; color: #fbbf24; shrink-0: 0; }

        main { flex: 1; padding: 16px; padding-bottom: 160px; overflow-y: auto; background-color: #fafafa; }

        /* 餐厅卡片：加入优雅的边框细节与间距，彻底消除空洞感 */
        .card { border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; background-color: #ffffff; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s; }
        .card:active { transform: scale(0.98); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-title { font-size: 16px; font-weight: bold; color: #111827; }
        .badge-owner { background-color: #dbeafe; color: #1e40af; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-user { background-color: #fef3c7; color: #92400e; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .address-box { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
        .address-text { font-size: 11px; color: #4b5563; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .copy-btn { background-color: #059669; color: #ffffff; border: none; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 6px; cursor: pointer; }

        .metrics { display: grid; grid-template-cols: 1fr 1fr; gap: 8px; text-align: center; font-size: 11px; padding: 8px 0; border-top: 1px dashed #e5e7eb; border-bottom: 1px dashed #e5e7eb; margin: 10px 0; }
        .text-ok { color: #059669; font-weight: bold; }
        .text-warn { color: #dc2626; font-weight: bold; }
        .click-tip { text-align: center; font-size: 11px; color: #2563eb; font-weight: bold; margin-top: 8px; }

        /* 第二页全屏详情大面板：顶部带高清健康食材封面，极大提升App付费高级感 */
        .detail-page { position: absolute; top: 0; left: 100%; width: 100%; height: 100%; background: #ffffff; z-index: 100; transition: left 0.3s ease-in-out; display: flex; flex-direction: column; }
        .detail-page.active { left: 0; }
        .detail-hero-banner { 
            height: 140px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.1)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .back-btn { background: rgba(17, 24, 39, 0.8); color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; align-self: flex-start; backdrop-filter: blur(2px); }
        .detail-body { flex: 1; padding: 18px; overflow-y: auto; background-color: #ffffff; border-radius: 16px 16px 0 0; margin-top: -12px; position: relative; z-index: 10; }
        
        .section-title { font-size: 13px; font-weight: bold; color: #1f2937; margin: 16px 0 8px 0; padding-left: 6px; border-left: 4px solid #059669; }
        .update-box { background-color: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; font-size: 12px; color: #065f46; line-height: 1.6; }
        .comment-item { background: #f9fafb; border: 1px solid #e5e7eb; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; }
        .comment-meta { display: flex; justify-content: space-between; font-size: 10px; color: #9ca3af; margin-bottom: 4px; }
        
        .comment-input-bar { display: flex; gap: 8px; margin-top: 12px; }
        .c-input { flex: 1; border: 1px solid #d1d5db; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }
        .c-btn { background: #059669; color: #ffffff; border: none; padding: 0 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }

        .bottom-actions { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
        .btn-user { background-color: #059669; color: #ffffff; border: none; font-size: 13px; font-weight: bold; padding: 14px; border-radius: 12px; cursor: pointer; text-align: center; box-shadow: 0 4px 6px rgba(4,120,87,0.2); }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 第一页主大厅：顶部融入高级蔬食色彩 -->
    <header>

    <main>

    <div class="bottom-actions">

        </div>
        <div class="detail-body">
            <h2 id="detailName" style="font-size: 18px; font-weight: bold; color: #111827;"></h2>
            <p id="detailAddress" style="font-size: 12px; color: #6b7280; margin: 4px 0 12px 0;"></p>
            
            <div class="section-title">✨ 核心内幕公告与过敏原分析</div>
            <div class="update-box" id="detailUpdateContent">暂无内容</div>
            
            <div class="section-title">💬 食客现场真话留言板/拼桌组局</div>
            <div id="comments-list"></div>
            
            <div class="comment-input-bar">
                <input type="text" class="c-input" id="commentInput" placeholder="直接在这里输入发给其他食客的信息...">
                <button class="c-btn" onclick="submitComment()">发送</button>
            </div>
        </div>
    </div>

</div>
