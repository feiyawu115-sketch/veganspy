<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>素探 VeganSpy - 全球多语言真话导航</title>
    <style>
        /* 纯原生高保真 App 样式 - 100% 杜绝白屏 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; min-height: 100vh; background: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: relative; }
        
        /* 顶部导航：隐藏手动菜单，保持极简 */
        header { background-color: #047857; color: #ffffff; padding: 14px 16px; position: sticky; top: 0; z-index: 50; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .header-top h1 { font-size: 20px; font-weight: 900; }
        
        /* 隐藏的手动一键切换按钮：做成极小的小地球 */
        .lang-toggle-btn { background: #065f46; color: #ffffff; border: 1px solid #059669; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 2px; }
        .lang-dropdown-box { display: none; position: absolute; top: 45px; right: 16px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 60; overflow: hidden; }
        .lang-dropdown-box.show { display: block; }
        .lang-option { padding: 8px 16px; font-size: 12px; color: #374151; cursor: pointer; text-align: left; }
        .lang-option:hover { background-color: #f3f4f6; }
        
        /* 城市切换与搜索栏 */
        .city-bar { background: #065f46; padding: 8px 12px; border-radius: 8px; display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        .city-input { background: #ffffff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; flex: 1; outline: none; font-weight: 500; }
        .city-label { font-size: 12px; font-weight: bold; color: #fbbf24; shrink-0; }

        /* 主体滚动区 */
        main { flex: 1; padding: 16px; padding-bottom: 150px; overflow-y: auto; }
        
        /* 筛选标签 */
        .filter-section { background-color: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .filter-title { font-size: 11px; font-weight: bold; color: #065f46; margin-bottom: 6px; }
        .filter-btn { background: #ffffff; color: #374151; border: 1px solid #d1d5db; padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .filter-btn.active { background-color: #059669; color: #ffffff; border-color: #059669; }

        /* 餐厅卡片 */
        .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; background-color: #ffffff; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-size: 16px; font-weight: bold; color: #111827; }
        .badge-owner { background-color: #dbeafe; color: #1e40af; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-user { background-color: #fef3c7; color: #92400e; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        /* 纯文本地址一键复制 */
        .address-box { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
        .address-text { font-size: 11px; color: #4b5563; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .copy-btn { background-color: #059669; color: #ffffff; border: none; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 6px; cursor: pointer; }

        /* 后厨真相指标 */
        .metrics { display: grid; grid-template-cols: 1fr 1fr; gap: 8px; text-align: center; font-size: 11px; padding: 8px 0; border-top: 1px dashed #e5e7eb; border-bottom: 1px dashed #e5e7eb; margin: 10px 0; }
        .text-ok { color: #059669; font-weight: bold; }
        .text-warn { color: #dc2626; font-weight: bold; }

        /* 爆料内容 */
        .info-box { font-size: 12px; color: #374151; line-height: 1.5; background: #fffbeb; padding: 10px; border-radius: 6px; border: 1px solid #fef3c7; }

        /* 底部双按钮 */
        .bottom-actions { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; }
        .btn-user { background-color: #059669; color: #ffffff; border: none; font-size: 13px; font-weight: bold; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; text-align: center; }
        .btn-owner { background-color: #1e3a8a; color: #ffffff; border: none; font-size: 13px; font-weight: bold; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; text-align: center; }
    </style>
</head>

        <!-- 城市输入栏 -->

    </header>

        </section>

        <!-- 动态渲染列表 -->
        <section id="list-container">
            <!-- 数据加载 -->
        </section>
    </main>

    <!-- 底部大按钮 -->

        <button class="btn-owner" onclick="postReport()" id="btn-act-owner">🏢 我是本地商家：公布店铺与产品</button>

</div>
